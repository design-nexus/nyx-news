[package]
name = "nyx-news"
version = "0.1.0"
description = "A local news reader for Omarchy: RSS, Atom, and JSON Feed"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nyx-news"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "918729504918ec344b3a853a5ce0ea2c9dbb7b5f" }
nyx-news-core = { path = "../../crates/nyx-news-core" }
nyx-sync = { git = "https://github.com/design-nexus/nyx-core.git", rev = "918729504918ec344b3a853a5ce0ea2c9dbb7b5f" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "8454ac9e6e10a22872b079be0893cf41406c4d11" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "8454ac9e6e10a22872b079be0893cf41406c4d11" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
toml = "1.1.6"
